# Clear-signing coverage dashboard.
# Installed by deploy/install.sh as /etc/nginx/sites-available/ccd (server_name
# filled from SITE_DOMAIN). HTTP only: `certbot --nginx -d <domain>` adds TLS.

# Map SSE / long requests: keep the upstream connection open.
upstream ccd_api {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_DOMAIN__;

    root /opt/ccd/app/apps/web/dist;
    index index.html;

    access_log /var/log/nginx/ccd.access.log;
    error_log  /var/log/nginx/ccd.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Vite puts a content hash in every asset file name: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Server-Sent Events: no buffering, no gzip, no timeout for an idle stream
    # (the API sends a comment ping every 15 s).
    location = /api/live/stream {
        proxy_pass http://ccd_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
        gzip off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /api/ {
        proxy_pass http://ccd_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
